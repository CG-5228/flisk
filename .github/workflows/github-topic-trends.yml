# Updates the GitHub topic trend report weekly. Run manually from Actions too.
name: 📊 GitHub topic trends

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trends:
    name: 📊 Refresh topic report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit the refreshed report back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # needed to push the refreshed report
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Analyze repository topic trends
        run: python scripts/github-topic-trends.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: reports/github-topics
      - name: Commit refreshed report
        run: |
          git add reports/github-topics/github-topic-trends.csv reports/github-topics/github-topic-trends.md
          if git diff --cached --quiet; then
            echo "Topic report unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh GitHub topic trends"
            git push
          fi
